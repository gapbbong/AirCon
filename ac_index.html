<body onresize="resizeBrowser()">
<script type="text/javascript">
    function resizeBrowser()
    {
        if(location.host != "127.0.0.1:8000" && window.innerWidth == 1024) {
            viewport = document.querySelector("meta[name=viewport]");
            viewport.setAttribute('content', 'width=1023px, initial-scale=1.0005, maximum-scale=1.1, user-scalable=yes');
        }
    }

    function detectBrowser()
    {
        // If we already tested, do not test again
        if ( browserInfo )
        {
            return browserInfo;
        }

        var browserData = [
            {
                string       : window.navigator.userAgent,
                subString    : 'Edge',
                versionSearch: 'Edge',
                identity     : 'Edge'
            },
            {
                string   : window.navigator.userAgent,
                subString: 'Chrome',
                identity : 'Chrome'
            },
            {
                string       : window.navigator.userAgent,
                subString    : 'OmniWeb',
                versionSearch: 'OmniWeb/',
                identity     : 'OmniWeb'
            },
            {
                string       : window.navigator.vendor,
                subString    : 'Apple',
                versionSearch: 'Version',
                identity     : 'Safari'
            },
            {
                prop    : window.opera,
                identity: 'Opera'
            },
            {
                string   : window.navigator.vendor,
                subString: 'iCab',
                identity : 'iCab'
            },
            {
                string   : window.navigator.vendor,
                subString: 'KDE',
                identity : 'Konqueror'
            },
            {
                string   : window.navigator.userAgent,
                subString: 'Firefox',
                identity : 'Firefox'
            },
            {
                string   : window.navigator.vendor,
                subString: 'Camino',
                identity : 'Camino'
            },
            {
                string   : window.navigator.userAgent,
                subString: 'Netscape',
                identity : 'Netscape'
            },
            {
                string       : window.navigator.userAgent,
                subString    : 'MSIE',
                identity     : 'Explorer',
                versionSearch: 'MSIE'
            },
            {
                string       : window.navigator.userAgent,
                subString    : 'Trident/7',
                identity     : 'Explorer',
                versionSearch: 'rv'
            },
            {
                string       : window.navigator.userAgent,
                subString    : 'Gecko',
                identity     : 'Mozilla',
                versionSearch: 'rv'
            },
            {
                string       : window.navigator.userAgent,
                subString    : 'Mozilla',
                identity     : 'Netscape',
                versionSearch: 'Mozilla'
            }
        ];

        var osData = [
            {
                string   : window.navigator.platform,
                subString: 'Win',
                identity : 'Windows'
            },
            {
                string   : window.navigator.platform,
                subString: 'Mac',
                identity : 'Mac'
            },
            {
                string   : window.navigator.platform,
                subString: 'Linux',
                identity : 'Linux'
            },
            {
                string   : window.navigator.platform,
                subString: 'iPhone',
                identity : 'iPhone'
            },
            {
                string   : window.navigator.platform,
                subString: 'iPod',
                identity : 'iPod'
            },
            {
                string   : window.navigator.platform,
                subString: 'iPad',
                identity : 'iPad'
            },
            {
                string   : window.navigator.platform,
                subString: 'Android',
                identity : 'Android'
            }
        ];

        var versionSearchString = '';

        function searchString(data)
        {
            for ( var i = 0; i < data.length; i++ )
            {
                var dataString = data[i].string;
                var dataProp = data[i].prop;

                versionSearchString = data[i].versionSearch || data[i].identity;

                if ( dataString )
                {
                    if ( dataString.indexOf(data[i].subString) !== -1 )
                    {
                        return data[i].identity;

                    }
                }
                else if ( dataProp )
                {
                    return data[i].identity;
                }
            }
        }

        function searchVersion(dataString)
        {
            var index = dataString.indexOf(versionSearchString);

            if ( index === -1 )
            {
                return;
            }

            return parseInt(dataString.substring(index + versionSearchString.length + 1));
        }

        var browser = searchString(browserData) || 'unknown-browser';
        var version = searchVersion(window.navigator.userAgent) || searchVersion(window.navigator.appVersion) || 'unknown-version';
        var os = searchString(osData) || 'unknown-os';

        // Prepare and store the object
        browser = browser.toLowerCase();
        version = browser + '-' + version;
        os = os.toLowerCase();

        var browserInfo = {
            browser: browser,
            version: version,
            os     : os
        };

        return browserInfo;
    }

    var browserInfo = detectBrowser();
    if ( browserInfo )
    {
        var htmlClass = browserInfo.browser + ' ' + browserInfo.version + ' ' + browserInfo.os;
//            console.log(htmlClass);
        if(browserInfo.version == "explorer-7"
            || browserInfo.version == "explorer-8"
            || browserInfo.version == "explorer-9"
            || browserInfo.version == "explorer-10"
        ) {
            // not support
            window.location.replace('/src/public/login.html');
        }
    }

</script>
